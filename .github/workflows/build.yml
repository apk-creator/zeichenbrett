name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: APK als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUFFIX=$(cat release-channel 2>/dev/null | tr -d "[:space:]"); SUFFIX=${SUFFIX:-beta}
          NAME="Klemmbrett_v1.${{ github.run_number }}_$SUFFIX"
          cp app/build/outputs/apk/release/app-release.apk "$NAME.apk"
          gh release delete latest -y --cleanup-tag || true
          gh release create "v1.${{ github.run_number }}" "$NAME.apk" \
            --title "$NAME" \
            --notes "Automatischer Build von ${{ github.sha }}" \
            --latest
